
workflows:
  picability-ios:
    name: Picability iOS Signed Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: Picability Apple API

    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.picability.app

    scripts:
      - name: Install frontend dependencies
        script: |
          cd KBK-Picability-Frontend
          npm ci

      - name: Build React frontend
        script: |
          cd KBK-Picability-Frontend
          npm run build

      - name: Sync Capacitor iOS project
        script: |
          cd KBK-Picability-Frontend
          npx cap sync ios

      - name: Configure Apple code signing
        script: |
          cd KBK-Picability-Frontend/ios/App
          xcode-project use-profiles

      - name: Set iOS build number
        script: |
          cd KBK-Picability-Frontend/ios/App
          agvtool new-version -all 2

      - name: Build signed iOS app
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/KBK-Picability-Frontend/ios/App/App.xcodeproj" \
            --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

      
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

